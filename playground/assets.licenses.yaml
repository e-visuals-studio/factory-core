# Register licenc (glej WEBSITE_FACTORY_PLAN.md, Avtorske pravice). Vsaka slika v repu mora imeti zapis.
#
# Polja: datoteka (pot ali vzorec), avtor, vir, licenca, ai, url, datum, dokazilo.
# avtor, vir in licenca so obvezni (factory preveri slike iz brief.yaml ob buildu).
# ai: true pomeni AI generirano sliko. Pravila iz plana:
#   - samo ilustracija (ozadja, teksture, abstraktni vizuali, blog ilustracije brez ljudi)
#   - nikoli "naša ekipa", "naš objekt", "naš izdelek" ali resničen dogodek; ne v galerijah referenc in na straneh o ekipi
#   - zabeleži še orodje, paket (komercialna raba dovoljena), prompt in datum
#   - na strani je označena kot AI ilustracija (blog post to naredi samodejno iz polja `ai` v frontmatterju)

- datoteka: src/assets/placeholders/*.jpg
  vir: generated
  avtor: scripts/gen-placeholders.ts
  licenca: none-required
  ai: false
  opomba: Barvni placeholderji iz tokens.json, brez tujih vsebin.

- datoteka: public/favicon.svg
  vir: generated
  avtor: e-visuals
  licenca: none-required
  ai: false

- datoteka: dist/og/**/*.png
  vir: generated at build (@e-visuals-studio/core, satori)
  avtor: e-visuals
  licenca: none-required
  ai: false
  opomba: Samodejne OG slike iz naslova in tokenov; font Inter (OFL-1.1, @fontsource/inter).
